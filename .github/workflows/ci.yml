
name: CI - tests ETL DVF

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dvf
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: dvf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dvf -d dvf_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DATABASE_URL: postgresql://dvf:ci_password@localhost:5432/dvf_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer le projet
        run: python -m pip install -e '.[dev]'

      - name: Verifier la qualite Python
        run: ruff check .

      - name: Tester le pipeline PostgreSQL
        run: pytest -q
