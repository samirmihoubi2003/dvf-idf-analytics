services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: dvf
      POSTGRES_PASSWORD: dvf_local_only
      POSTGRES_DB: dvf
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvf -d dvf"]
      interval: 5s
      timeout: 5s
      retries: 10

  etl:
    build: .
    profiles: ["etl"]
    environment:
      DATABASE_URL: postgresql://dvf:dvf_local_only@db:5432/dvf
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/raw:/app/data/raw

volumes:
  pgdata:
