name: CI - tests ETL DVF

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dvf
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: dvf
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dvf -d dvf"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://dvf:ci_password@localhost:5432/dvf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installer le projet et les outils
        run: python -m pip install -e '.[dev]'
      - name: Vérifier la qualité Python
        run: ruff check .
      - name: Tester le pipeline (dont PostgreSQL)
        run: pytest -q
